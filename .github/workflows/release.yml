name: release

# Builds every tagged version on a GitHub-hosted runner from the tagged source, signs it through SignPath
# (when the SignPath variables are set) and attaches the installer + its SHA-256 to the GitHub release.
# Repository settings once SignPath has approved the project:
#   variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG (yzip), SIGNPATH_POLICY_SLUG (release-signing)
#   secret:    SIGNPATH_API_TOKEN
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          choco install innosetup -y --no-progress

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import sys, version; sys.exit(0 if version.__version__ == '${{ github.ref_name }}'.lstrip('v') else 'version.py does not match the tag')"

      - name: Bundled extractors (7-Zip, unegg, unalz)
        shell: powershell
        run: .\fetch_tools.ps1

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          YZIP_NO_UPDATE: "1"
        run: python -W ignore -m unittest test_ziplib test_zipwriter test_formats test_moreformats test_updater

      - name: Build app (shell extension + exe)
        shell: powershell
        run: .\build.ps1 -Stage app

      - name: Upload app for signing
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: yzip-app
          path: dist/yzip/

      - name: Sign app (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/yzip-signed

      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          Remove-Item -Recurse -Force dist\yzip
          Move-Item dist\yzip-signed dist\yzip
          (Get-AuthenticodeSignature dist\yzip\yzip.exe).Status

      - name: Build installer
        shell: powershell
        run: .\build.ps1 -Stage installer

      - name: Upload installer for signing
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: yzip-setup
          path: dist/yzip-setup-*.exe

      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/setup-signed

      - name: Checksum and release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import version; print(version.__version__)"
          $name = "yzip-setup-$v.exe"
          if (Test-Path "dist\setup-signed\$name") { Copy-Item "dist\setup-signed\$name" "dist\$name" -Force }
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\$name.sha256", "$hash  $name`n")
          if ("${{ github.ref_type }}" -ne "tag") { Write-Output "not a tag: build only"; exit 0 }
          $tag = "${{ github.ref_name }}"
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($tags -notcontains $tag) {
            # every release page states the code signing policy (a SignPath Foundation requirement)
            gh release create $tag --title "yzip $v" --notes-file .github\release-signing.md --generate-notes
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist\$name" "dist\$name.sha256" --clobber
          exit $LASTEXITCODE
