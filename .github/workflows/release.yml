name: release

# Builds every tagged version on a GitHub-hosted runner from the tagged source and attaches
# the intentionally unsigned installer + its SHA-256 to the GitHub release.
# Repository settings once SignPath has approved the project:
#   variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG (yzip), SIGNPATH_POLICY_SLUG (release-signing)
#   secret:    SIGNPATH_API_TOKEN
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # SignPath Foundation approval is unavailable; do not submit or wait for signing.
      SIGN: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }  # otherwise only the last command's failure stops the job
          choco install innosetup -y --no-progress

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import sys, version; sys.exit(0 if version.__version__ == '${{ github.ref_name }}'.lstrip('v') else 'version.py does not match the tag')"

      - name: Bundled native archive backends
        shell: powershell
        run: |
          .\fetch_tools.ps1
          .\nativeaccel\build.ps1 -OutputDirectory tools

      - name: Native payload sanity check
        shell: powershell
        run: |
          $required = "tools\7z.dll", "tools\7zip-pins.json", "tools\libarchive.dll", "tools\yzip_accel.dll", "tools\yzip_native.dll", "tools\zpaq.exe"
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "missing native payload: $path" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            Write-Output "$path $hash"
          }
          $env:YZIP_LIBARCHIVE_DLL = (Resolve-Path "tools\libarchive.dll").Path
          $env:YZIP_ACCEL_DLL = (Resolve-Path "tools\yzip_accel.dll").Path
          $env:YZIP_NATIVE_DLL = (Resolve-Path "tools\yzip_native.dll").Path
          python -c "import ctypes, os; ctypes.WinDLL(os.environ['YZIP_LIBARCHIVE_DLL']); ctypes.WinDLL(os.environ['YZIP_NATIVE_DLL']); from archive_accel import CAP_ZIP_EXTRACT, load_accelerator; a = load_accelerator(os.environ['YZIP_ACCEL_DLL']); assert a is not None and a.capabilities & CAP_ZIP_EXTRACT"
          if ((Get-Item "tools\zpaq.exe").Length -lt 100000) { throw "zpaq.exe is unexpectedly small" }

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          YZIP_NO_UPDATE: "1"
        run: python -W ignore -m unittest test_ziprepair test_ziplib test_zipwriter test_formats test_nativearchive test_moreformats test_updater test_archive_accel test_zip_native test_zip_extract_perf

      - name: Preferences tests
        env:
          QT_QPA_PLATFORM: offscreen
          YZIP_NO_UPDATE: "1"
        run: |
          foreach ($suite in @('test_settings_core', 'test_preferences', 'test_settings_flows', 'test_appearance', 'test_shell_settings', 'test_ui_renewal')) {
            python -W ignore -m unittest $suite
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Build app (shell extension + exe)
        shell: powershell
        run: .\build.ps1 -Stage app

      - name: Packaged native accelerator and EXE smoke
        shell: powershell
        run: |
          $accel = @(Get-ChildItem dist\yzip -Recurse -Filter yzip_accel.dll)
          $pins = @(Get-ChildItem dist\yzip -Recurse -Filter 7zip-pins.json)
          $runtime = @(Get-ChildItem dist\yzip -Recurse -Filter 7z.dll)
          if ($accel.Count -ne 1 -or $pins.Count -ne 1 -or $runtime.Count -ne 1) {
            throw "packaged native accelerator payload is incomplete"
          }
          python .\packaged_native_smoke.py
          $marker = Join-Path $env:RUNNER_TEMP "yzip-version-smoke.txt"
          $env:YZIP_UPDATE_TEST_MARKER = $marker
          $env:YZIP_NO_UPDATE = "1"
          $smoke = Start-Process .\dist\yzip\yzip.exe -ArgumentList "--updated" -Wait -PassThru -WindowStyle Hidden
          if ($smoke.ExitCode) { throw "packaged yzip.exe smoke failed (exit $($smoke.ExitCode))" }
          $expected = python -c "import version; print(version.__version__)"
          if ((Get-Content -Raw $marker) -ne $expected) { throw "packaged yzip.exe version smoke mismatch" }

      - name: Native menu preferences tests
        shell: powershell
        run: .\test_shell_native.ps1

      - name: Packaged Explorer verb smoke
        shell: powershell
        run: python .\exe_verbs_smoke.py

      - name: Upload unsigned app artifact
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: yzip-app
          path: dist/yzip/

      - name: Sign app (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/yzip-signed

      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          Remove-Item -Recurse -Force dist\yzip
          Move-Item dist\yzip-signed dist\yzip
          (Get-AuthenticodeSignature dist\yzip\yzip.exe).Status

      - name: Build installer
        shell: powershell
        run: .\build.ps1 -Stage installer

      - name: Upload unsigned installer artifact
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: yzip-setup
          path: dist/yzip-setup-*.exe

      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/setup-signed

      - name: Checksum and release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import version; print(version.__version__)"
          $name = "yzip-setup-$v.exe"
          if (Test-Path "dist\setup-signed\$name") { Copy-Item "dist\setup-signed\$name" "dist\$name" -Force }
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\$name.sha256", "$hash  $name`n")
          if ("${{ github.ref_type }}" -ne "tag") { Write-Output "not a tag: build only"; exit 0 }
          $tag = "${{ github.ref_name }}"
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($tags -notcontains $tag) {
            $notes = ".github\release-notes-$v.md"
            if (-not (Test-Path $notes)) { $notes = '.github\release-signing.md' }
            gh release create $tag --title "yzip $v" --notes-file $notes --generate-notes
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist\$name" "dist\$name.sha256" --clobber
          exit $LASTEXITCODE
